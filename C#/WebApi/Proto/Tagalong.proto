syntax = "proto3";

option csharp_namespace = "Tagalong.Grpc";

package greet;

service Tagalong {
  rpc SayHello (HelloRequest) returns (HelloReply);
  rpc StreamReplies (HelloRequest) returns (stream HelloReply);
}

message HelloRequest {
  string name = 1;
}

message HelloReply {
  string message = 1;
}