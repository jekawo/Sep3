syntax = "proto3";

package tagalong;

option java_multiple_files = true;
option java_package = "tagalong.grpc";
option csharp_namespace = "Tagalong.Grpc";

import "google/protobuf/timestamp.proto";

service TripService {
  rpc CreateTrip(CreateTripRequest) returns (Trip);
  rpc GetTrip(GetTripRequest) returns (Trip);
  rpc ListTripsForUser(ListTripsForUserRequest) returns (ListTripsResponse);
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse);
}

message Trip {
  int64 id = 1;
  string title = 2;
  string destination = 3;
  string start_date = 4;
  string end_date = 5;
  string description = 6;
  int64 created_by = 7;
}

message Member {
  int64 user_id = 1;
  string name = 2;
  google.protobuf.Timestamp joined_at = 3;
}

message CreateTripRequest {
  int64 requesting_user_id = 1;
  string title = 2;
  string destination = 3;
  string start_date = 4;
  string end_date = 5;
  string description = 6;
}

message GetTripRequest {
  int64 requesting_user_id = 1;
  int64 trip_id = 2;
}

message ListTripsForUserRequest{
  int64 requesting_user_id = 1;
}

message ListTripsResponse {
  repeated Trip trips = 1;
}

message ListMembersRequest{
  int64 requesting_user_id = 1;
  int64 trip_id = 2;
}

message ListMembersResponse{
  repeated Member members = 1;
}