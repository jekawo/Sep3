
name: Trip Planner CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  java-build:
    name: Java Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: Java/TagalongJavaServer/pom.xml

      - name: Build Java
        working-directory: Java/TagalongJavaServer
        run: mvn -B clean compile

  dotnet-build:
    name: .NET Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build .NET Solution
        run: dotnet build "C#/Sep3.slnx" --configuration Release
